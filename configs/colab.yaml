# ==========================================
# Colab Configuration
# ==========================================

experiment:
  name: "codet5_colab_configuration"
  seed: 42
  log_path: "logs/experiments_log.csv"
  notes: "Final optimal baseline"

data:
  dataset_name: "code-search-net/code_search_net"
  language: "python"
  debug: false
  debug_size: 1000
  max_input_length: 256
  max_target_length: 64

model:
  checkpoint: "Salesforce/codet5-small"

training:
  output_dir: "./checkpoints/colab_run"
  max_steps: 600
  num_train_epochs: 1
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  logging_steps: 25         
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  fp16: true

generation:
  num_beams: 4
  max_length: 64
  length_penalty: 1.0
  num_qualitative_examples: 5