# ==========================================
# Fast Local Smoke Test Configuration (CPU/Local GPU)
# ==========================================

experiment:
  name: "codet5_smoke_test"
  seed: 42

data:
  dataset_name: "code_search_net"
  language: "python"
  debug: true                    
  debug_size: 100                
  max_input_length: 128          
  max_target_length: 32

model:
  checkpoint: "Salesforce/codet5-small"

training:
  output_dir: "./checkpoints/debug_run"
  max_steps: 10                  
  num_train_epochs: 1
  batch_size: 4                  
  learning_rate: 3.0e-4
  weight_decay: 0.01
  logging_steps: 1               
  eval_steps: 5                  
  save_steps: 10
  save_total_limit: 1
  fp16: false                     

generation:
  num_beams: 1                   
  max_length: 32
  length_penalty: 1.0
  num_qualitative_examples: 2